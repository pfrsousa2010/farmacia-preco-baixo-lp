[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 e React 19 exigem Node moderno; o padrão da Netlify pode ser mais antigo.
  NODE_VERSION = "22"

# Os arquivos em dist/assets têm hash no nome, então podem ser cacheados para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
